version: "3.9"

services:

  db:
    image: postgres:17
    container_name: postgres_db

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build:
      context: ./p1

    container_name: django_backend

    command: gunicorn p1.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - ./p1:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  frontend:

    build:
      context: ./frontend

    container_name: react_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:

  postgres_data: